name: Keep Supabase Alive (Error MES)

# Ping Supabase otomatis tiap hari supaya project free TIDAK ke-pause,
# walau tidak ada yang membuka website Error MES (mis. libur panjang).
#
# Project yang di-ping SAMA dengan yang dipakai index.html:
#   https://ngiiqkhcigcnolgmttet.supabase.co
#
# BONUS: workflow ini menulis catatan waktu kecil & commit ke repo tiap kali
# jalan. Itu membuat repo selalu "aktif", sehingga GitHub TIDAK menonaktifkan
# jadwal ini (normalnya jadwal mati kalau repo 60 hari tanpa aktivitas).

on:
  schedule:
    - cron: '0 3 * * *'   # tiap hari ~10:00 WIB
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions

permissions:
  contents: write          # izin agar workflow boleh commit catatan waktu

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Ping Supabase + catat waktu
        run: |
          echo "Ping Supabase pada $(date -u)"

          ping_url () {
            # coba sampai 3x, jaga-jaga project baru bangun / jaringan putus-putus
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" \
                -H "apikey: ${SUPABASE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_KEY}" \
                "$1")
              if [ "$code" != "000" ] && [ "${code:0:1}" != "5" ]; then
                echo "$code"; return 0
              fi
              sleep 10
            done
            echo "$code"; return 1
          }

          # 1) Ping tabel utama aplikasi (menyentuh database)
          db_code=$(ping_url "${SUPABASE_URL}/rest/v1/machine_errors?select=id&limit=1")
          echo "DB   (machine_errors) HTTP: $db_code"

          # 2) Ping layanan Auth (login Google)
          auth_code=$(ping_url "${SUPABASE_URL}/auth/v1/health")
          echo "Auth (health)         HTTP: $auth_code"

          # Gagal hanya kalau server tidak merespons sama sekali (000) atau error 5xx.
          # 401/403 (ditolak RLS) tetap OK: artinya project hidup & menerima request.
          for c in "$db_code" "$auth_code"; do
            if [ "$c" = "000" ] || [ "${c:0:1}" = "5" ]; then
              echo "Gagal konek ke Supabase (status $c)."; exit 1
            fi
          done

          # Tulis catatan waktu — supaya ada perubahan untuk di-commit
          echo "Terakhir ping: $(date -u) (DB $db_code, Auth $auth_code)" > keepalive-last.txt
          echo "Supabase tetap aktif"
        env:
          SUPABASE_URL: https://ngiiqkhcigcnolgmttet.supabase.co
          SUPABASE_KEY: sb_publishable_DwDJFaJXAtScfghhl7_RmA_Ex_cMmgY

      - name: Commit catatan waktu (jaga repo tetap aktif)
        run: |
          git config user.name  "keepalive-bot"
          git config user.email "actions@github.com"
          git add keepalive-last.txt
          # commit hanya kalau ada perubahan
          git diff --staged --quiet || git commit -m "keepalive: $(date -u)"
          git push
